<!DOCTYPE html>
<html>
<head>
    <title>Interactive To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive To Do List</h1>

    <ul id="todo-list">
        <li onclick="toggleTask(this)">
            Complete my assignment
            <span class="check">✓</span>
        </li>

        <li onclick="toggleTask(this)">
            Read my notes
            <span class="check">✓</span>
        </li>

        <li onclick="toggleTask(this)">
            Attend my meeting
            <span class="check">✓</span>
        </li>

        <li onclick="toggleTask(this)">
            Submit my project
            <span class="check">✓</span>
        </li>
    </ul>

    <script src="script.js"></script>
</body>
</html>
